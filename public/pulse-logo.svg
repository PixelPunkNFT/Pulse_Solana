<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00ffff"/>
            <stop offset="50%" style="stop-color:#0000ff"/>
            <stop offset="100%" style="stop-color:#800080"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <path d="M200 50C250 50 300 100 350 150C400 200 400 250 350 300C300 350 250 400 200 350C150 300 100 250 50 200C0 150 50 100 100 50C150 0 150 50 200 50Z" 
          fill="url(#gradient)"
          filter="url(#glow)"/>
</svg>
